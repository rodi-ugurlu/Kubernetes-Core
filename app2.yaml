# app2.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
  namespace: playground
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app2
  template:
    metadata:
      labels:
        app: app2
    spec:
      containers:
        - name: app2
          image: hashicorp/http-echo:latest
          args:
            - "-text=Hello from app2"
            - "-listen=:5678"
          ports:
            - containerPort: 5678
---
apiVersion: v1
kind: Service
metadata:
  name: app2
  namespace: playground
spec:
  selector:
    app: app2
  ports:
    - port: 5678
      targetPort: 5678
